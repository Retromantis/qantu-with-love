<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Mutant Chickens</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #canvas,
        #loadingCanvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            outline: none;
        }

        #canvas {
            visibility: hidden;
        }

        #loadingCanvas {
            visibility: visible;
        }
    </style>
</head>

<body>
    <canvas id="loadingCanvas" oncontextmenu="event.preventDefault()"></canvas>

    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <script>
        function goFullScreen() {
            const canvas = document.getElementById("canvas");

            if (canvas.requestFullscreen) {
                canvas.requestFullscreen();
            } else if (canvas.webkitRequestFullscreen) {
                canvas.webkitRequestFullscreen();
            }
        }

        function FullScreenHook() {
            const canvas = document.getElementById("canvas");
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        const loadingContext =
            document.getElementById("loadingCanvas").getContext("2d");

        function drawLoadingText(text) {
            const canvas = loadingContext.canvas;

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            loadingContext.fillStyle = "#000";
            loadingContext.fillRect(0, 0, canvas.width, canvas.height);

            loadingContext.font = "20px Arial";
            loadingContext.textAlign = "center";
            loadingContext.fillStyle = "#fff";
            loadingContext.fillText(text, canvas.width / 2, canvas.height / 2);
        }

        window.onload = function () {
            window.focus();
            FullScreenHook();
        };

        window.onclick = function () {
            window.focus();
        };

        window.addEventListener("resize", FullScreenHook);

        window.addEventListener("keydown", function (e) {
            if ([32, 37, 38, 39, 40].includes(e.keyCode)) {
                e.preventDefault();
            }
        }, false);

        var Module = {
            arguments: ["./game.love"],
            INITIAL_MEMORY: 16777216,
            printErr: console.error.bind(console),

            canvas: (function () {
                const canvas = document.getElementById("canvas");

                canvas.addEventListener("webglcontextlost", function (e) {
                    alert("WebGL context lost. Reload the page.");
                    e.preventDefault();
                }, false);

                return canvas;
            })(),

            setStatus: function (text) {
                if (text) {
                    drawLoadingText(text);
                } else if (Module.remainingDependencies === 0) {
                    document.getElementById("loadingCanvas").style.display = "none";
                    document.getElementById("canvas").style.visibility = "visible";
                }
            },

            totalDependencies: 0,
            remainingDependencies: 0,

            monitorRunDependencies: function (left) {
                this.remainingDependencies = left;
                this.totalDependencies = Math.max(this.totalDependencies, left);

                Module.setStatus(
                    left
                        ? "Preparing... (" +
                        (this.totalDependencies - left) + "/" +
                        this.totalDependencies + ")"
                        : "All downloads complete."
                );
            }
        };

        Module.setStatus("Downloading...");

        window.onerror = function (event) {
            Module.setStatus("Error. See browser console.");
            Module.setStatus = function (text) {
                if (text) Module.printErr("[post-exception status] " + text);
            };
        };

        var applicationLoad = function (e) {
            Love(Module);
        };
    </script>

    <script src="game.js"></script>
    <script async src="love.js" onload="applicationLoad(this)"></script>
</body>

</html>
